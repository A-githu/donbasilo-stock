<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mouvements de stock — Don Basilo</title>
  <script>(function(){try{if(localStorage.getItem("donbasilo_theme")==="sombre"){document.documentElement.setAttribute("data-theme","sombre");}}catch(e){}})();</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page-title="Mouvements de stock" data-page-subtitle="Entrées (réapprovisionnement) et sorties (ventes)">
  <div class="app-shell">
    <div id="sidebar-backdrop"></div>
    <aside id="sidebar"></aside>

    <div class="app-main">
      <header id="topbar"></header>

      <main class="page-content">
        <div class="carte">
          <h2 class="titre-section" id="titre-formulaire-mouvement">Enregistrer une vente</h2>
          <form id="form-mouvement">
            <label for="mouvement-produit">Produit</label>
            <select id="mouvement-produit" required></select>

            <div id="zone-type-mouvement" hidden>
              <label for="mouvement-type">Type de mouvement</label>
              <select id="mouvement-type">
                <option value="sortie">Sortie (vente)</option>
                <option value="entree">Entrée (réapprovisionnement)</option>
              </select>
            </div>

            <label for="mouvement-quantite">Quantité</label>
            <input type="number" id="mouvement-quantite" min="1" step="1" required>

            <label for="mouvement-motif">Motif (optionnel)</label>
            <input type="text" id="mouvement-motif" placeholder="Ex : Vente client, Réception fournisseur...">

            <p id="message-erreur-mouvement" class="message-erreur" hidden></p>
            <p id="message-succes-mouvement" class="message-info" hidden></p>

            <button type="submit" class="btn" style="margin-top:1rem;">Enregistrer</button>
          </form>
        </div>

        <div class="barre-outils" id="barre-filtre-historique" hidden>
          <select id="filtre-type-historique">
            <option value="">Tous les mouvements</option>
            <option value="entree">Entrées</option>
            <option value="sortie">Sorties</option>
          </select>
        </div>

        <div class="carte" id="carte-historique" hidden>
          <h2 class="titre-section">Historique</h2>
          <table>
            <thead>
              <tr><th>Produit</th><th>Type</th><th>Quantité</th><th>Motif</th><th>Par</th><th>Date</th></tr>
            </thead>
            <tbody id="corps-historique"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/mouvements.js"></script>
</body>
</html>
